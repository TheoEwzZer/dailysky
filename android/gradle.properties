org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- Contournement du bug de verrou de fichier Kotlin/Gradle sous Windows ---
# Erreurs « Could not close incremental caches » / « Storage ... already
# registered » : causées par l'antivirus (Windows Defender) qui verrouille les
# fichiers .tab du dossier build/, et/ou des démons Gradle résiduels.
# Le vrai correctif durable = exclure le dossier du projet de l'antivirus.
# En attendant, ces options rendent le build fiable (build un peu plus lent).
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
kotlin.incremental=false
